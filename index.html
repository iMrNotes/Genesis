<script>
(()=>{'use strict';
const $=id=>document.getElementById(id), canvas=$('universe'),ctx=canvas.getContext('2d'), KEY='genesis-god-of-everything-v1', STORAGE_VERSION=2;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)],fmt=n=>Math.round(n).toLocaleString('en-US');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const colors={ocean:'#59a3d6',garden:'#6bbd9f',rock:'#a8a3a3',desert:'#c48a60',ice:'#b1dded',gas:'#cfb0a2',volcanic:'#c86a53'};
const names=['Aurora','Vesper','Elysium','Thalassa','Nyx','Orion','Astra','Cinder','Verdant','Halcyon','Nova','Serenity','Kairo','Solis'];
let camera={x:0,y:0,zoom:1}, view={w:0,h:0,dpr:1},sheetPanel=null,selected=null,now=0,toastTimer=0,saveTimer=0,lastRender=0,lastHud=0,drag=null,activePointers=new Map(),pinchStart=null;
let state=null;
const baseState=()=>({version:STORAGE_VERSION,name:'The First Light',year:0,star:null,planets:[],log:[],counter:1,speed:1,plotArmor:false,ambientEvents:true,tempUnit:'C',eventInbox:[],nextEventId:1,firstContacts:[],lastEvent:0,eventsSeen:0});
function planetOf(name,kind,distance,opts={}){return {id:state.counter++,name,kind,distance,size:opts.size??1,angle:rnd(0,Math.PI*2),water:opts.water??(kind==='ocean'?72:kind==='garden'?59:kind==='ice'?33:5),atmosphere:opts.atmosphere??(kind==='gas'?98:kind==='garden'?82:kind==='ocean'?85:28),resources:opts.resources??68,tempBias:opts.tempBias??0,life:opts.life??0,lifeAge:opts.lifeAge??0,civYears:opts.civYears??0,pop:opts.pop??0,tech:opts.tech??0,stability:opts.stability??72,faith:opts.faith??10,organisms:opts.organisms??(opts.life===1?2.4e9:opts.life===2?550000:opts.life===3?45000:0),happiness:opts.happiness??72,war:opts.war??0,culture:opts.culture??'',politics:opts.politics??'',species:opts.species??'',moons:opts.moons??0,protected:0,history:[]}};
function pushLog(message,type='cosmos',p=null){let entry={year:Math.round(state.year),message,type,planetId:p?.id??null};state.log.unshift(entry);if(state.log.length>350)state.log.length=350;if(p){p.history=p.history||[];p.history.unshift(entry);if(p.history.length>45)p.history.length=45;} scheduleSave();}
function startingState(){state=baseState();state.star={name:'Sol',lum:1,hue:40,mass:1};state.planets.push(planetOf('Eden','ocean',1,{water:72,atmosphere:82,resources:84,life:1,lifeAge:18000000,moons:1}));state.planets.push(planetOf('Pyrus','desert',1.63,{water:9,atmosphere:38,resources:91,moons:2}));state.planets.push(planetOf('Nivalis','ice',2.24,{water:42,atmosphere:34,resources:65}));pushLog('Sol ignited in the darkness. Your universe began.');pushLog('Eden, Pyrus, and Nivalis took shape around Sol.');pushLog('You seeded the first microorganisms on Eden.','life',state.planets[0]);selected=state.planets[0].id;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){showToast('Device storage unavailable — export a backup.');return false;}return true;}
function scheduleSave(){clearTimeout(saveTimer);saveTimer=setTimeout(save,600)}
function validate(s){return !!(s&&(s.version===1||s.version===2)&&(s.star===null||(s.star&&typeof s.star.lum==='number'))&&Array.isArray(s.planets)&&s.planets.length<=50&&Array.isArray(s.log)&&typeof s.year==='number'&&isFinite(s.year));}
function normalizeState(s){s.version=2;s.tempUnit=s.tempUnit==='F'?'F':'C';s.ambientEvents=s.ambientEvents!==false;s.eventInbox=Array.isArray(s.eventInbox)?s.eventInbox.slice(0,15):[];s.nextEventId=Math.max(1,Number(s.nextEventId)||1);if(s.star){s.star.mass=clamp(Number(s.star.mass)||1,.35,3);s.star.hue=clamp(Number(s.star.hue??40),0,360);s.star.lum=clamp(Number(s.star.lum)||1,.35,2.5)}for(const p of s.planets){p.organisms=Number.isFinite(p.organisms)?p.organisms:p.life===1?2.4e9:p.life===2?550000:p.life===3?45000:0;p.happiness=Number.isFinite(p.happiness)?p.happiness:72;p.war=Number.isFinite(p.war)?p.war:0;p.culture=p.culture||'';p.politics=p.politics||'';p.species=p.species||'';p.history=p.history||[]}return s}
try{const stored=localStorage.getItem(KEY);if(stored){const parsed=JSON.parse(stored);if(validate(parsed)){state=normalizeState(parsed);state.speed=Number.isFinite(Number(state.speed))?Number(state.speed):1;state.counter=state.counter||Math.max(1,...state.planets.map(p=>p.id+1));state.firstContacts=state.firstContacts||[];state.log=state.log.slice(0,350);selected=state.planets[0]?.id??null;}}}catch(e){}if(!state)startingState();normalizeState(state);
const world=id=>state.planets.find(p=>p.id===Number(id)),selectedWorld=()=>world(selected),yearLabel=n=>n>=1e9?(n/1e9).toFixed(3)+' billion years':n>=1e6?(n/1e6).toFixed(2)+' million years':fmt(n)+' years';
const STAR_CLASSES=[{key:'M',name:'Red dwarf',mass:.48,hue:9,uv:.55},{key:'K',name:'Orange dwarf',mass:.7,hue:25,uv:.75},{key:'G',name:'Yellow dwarf',mass:1,hue:43,uv:1},{key:'F',name:'White-yellow star',mass:1.25,hue:55,uv:1.42},{key:'A',name:'White star',mass:1.8,hue:196,uv:2.5},{key:'B',name:'Blue star',mass:2.7,hue:218,uv:4.2}];
function starClass(st=state.star){if(!st)return STAR_CLASSES[2];return STAR_CLASSES[st.mass<.58?0:st.mass<.82?1:st.mass<1.15?2:st.mass<1.48?3:st.mass<2.15?4:5]}
function starLight(){return state.star?Math.pow(state.star.mass||1,3.2)*state.star.lum:0}
function starRadiation(p){if(!state.star)return 0;let classUV=starClass().uv, orbital=1/Math.max(.18,p.distance*p.distance);let tint=state.star.hue>=160&&state.star.hue<=275?1.18:state.star.hue<32?.9:1;return classUV*orbital*tint*(1-clamp(p.atmosphere,0,100)*.0065)}
function radiationLabel(p){let r=starRadiation(p);return r<.55?'Low':r<1.4?'Moderate':r<2.8?'Elevated':'Severe'}
function tempValue(c){return state.tempUnit==='F'?c*9/5+32:c}
function tempLabel(c){return Math.round(tempValue(c))+'°'+state.tempUnit}
function tempOffsetLabel(c){return Math.round(state.tempUnit==='F'?c*9/5:c)+'°'+state.tempUnit}
function temperature(p){return clamp(14+78*(Math.pow(Math.max(.03,starLight()),.25)/Math.sqrt(Math.max(.2,p.distance))-1)+p.tempBias,-245,600)}
function habit(p){const t=temperature(p);let ts=clamp(100-Math.max(0,Math.abs(t-22)-10)*2,0,100),a=clamp((p.atmosphere-15)*1.7,0,100),w=clamp(p.water*2.1,0,100);return Math.round(clamp(Math.min(ts,a,w)*.55+(ts+a+w)/3*.45-Math.max(0,starRadiation(p)-1.25)*7,0,100))}
function habLabel(p){let h=habit(p);return h>=72?'Flourishing':h>=48?'Habitable':h>=25?'Harsh':'Hostile'}
const lifeText=['Lifeless','Microbial life','Complex life','Intelligent life','Civilization'];
const techNames=['Tribal age','Agricultural age','Industrial age','Information age','Early space age','Interplanetary age'];
function civName(p){return p.name.replace(/[^a-z]/gi,'').slice(0,13)+'ians'}
function popText(n){if(!n)return '0';if(n>=1e12)return (n/1e12).toFixed(2)+' trillion';if(n>=1e9)return (n/1e9).toFixed(2)+' billion';if(n>=1e6)return (n/1e6).toFixed(2)+' million';return fmt(n)}
function lifeCount(p){return p.life===4?p.pop:p.organisms||0}
function lifeStageName(p){return p.life===4?techNames[p.tech]:lifeText[p.life]}
function evoThreshold(p){let base=([0,48000000,135000000,240000000][p.life]||0),radiation=starRadiation(p);return base*(1+Math.max(0,radiation-1)*.24+(100-habit(p))/220)}
function evolvePercent(p){return p.life===0?clamp((p.abiogenesis||0)/220000000*100,0,100):p.life===4?clamp(p.civYears/75000*100,0,100):clamp(p.lifeAge/evoThreshold(p)*100,0,100)}
function getNeeds(p){let hab=habit(p),food=clamp(p.resources*.68+hab*.32-Math.max(0,Math.log10(1+p.pop)-7)*4,0,100),water=clamp(p.water*1.1+hab*.22,0,100),safety=clamp(p.stability*.75+hab*.25-p.war*.38,0,100),energy=clamp(p.resources*.72+p.tech*6,0,100);return {food,water,safety,energy}}
function strongestNeed(p){const n=getNeeds(p);return Object.entries(n).sort((a,b)=>a[1]-b[1])[0]}
function starAdaptation(p){const s=starClass(),r=starRadiation(p);return r>2.8?'Radiation-resistant life favored':s.key==='M'||s.key==='K'?'Low-light adaptation favored':s.key==='B'||s.key==='A'?'Protective pigments and fast adaptation favored':state.star.hue>=160&&state.star.hue<=275?'Blue-light absorbing pigments favored':'Balanced light adaptation favored'}

function populateIdentity(p){if(!p.species)p.species=({ocean:'Tideborn',ice:'Frostkin',desert:'Dunewalkers',garden:'Verdants',volcanic:'Emberborn',rock:'Stonekin',gas:'Cloudwalkers'})[p.kind]||'Starborn';if(!p.culture)p.culture=({ocean:'Tide lore and navigation',ice:'Kinship and endurance',desert:'Trade and oral epics',garden:'Nature and stewardship',volcanic:'Craft and resilience',rock:'Stonecraft and exploration',gas:'Sky myths and migration'})[p.kind]||'Exploration and story';if(!p.politics)p.politics='Independent settlements'}
function politicalSystem(p){return p.tech<1?'Village councils':p.stability<30?'Fragmented city-states':p.tech<3?'Regional kingdoms and councils':p.tech<5?'Representative federations':'Planetary federation'}
function socialStory(p){populateIdentity(p);return p.faith>65?'Widespread creator worship':p.faith>30?'Diverse spiritual traditions':'Naturalist and local belief traditions'}
function meter(label,v,unit='%'){return `<div class="meterRow"><div class="row"><span>${label}</span><b class="number">${Math.round(v)}${unit}</b></div><div class="progress"><span style="width:${clamp(v,0,100)}%"></span></div></div>`}
function lifeDashboard(p){if(!p.life)return `<div class="card"><h3>◌ No life detected</h3><p>Seed microorganisms or allow habitable conditions to nurture spontaneous life.</p>${meter('Abiogenesis',evolvePercent(p))}</div>`;let stage=p.life===4?'Civilization':lifeText[p.life];let countType=p.life===1?'Estimated microbial units':p.life===2?'Complex organisms':p.life===3?'Intelligent beings':'Population';let n=getNeeds(p),wanted=strongestNeed(p);return `<div class="card"><div class="row"><h3>❧ Living world</h3><span class="pill good">${stage}</span></div><div class="grid2"><div class="stat"><small>${countType}</small><strong style="font-size:16px">${popText(lifeCount(p))}</strong></div><div class="stat"><small>${p.life===4?'Happiness':'Biosphere health'}</small><strong>${Math.round(p.life===4?p.happiness:habit(p))}%</strong></div></div>${meter(p.life===4?'Progress toward space age':'Evolution toward next stage',evolvePercent(p))}<p class="mini">${p.life===1?'Microbes are adapting, reproducing and filling ecological niches.':p.life===2?'Multicellular organisms diversify as ecosystems become more complex.':p.life===3?'Intelligent species are learning, cooperating, and discovering their world.':'A thriving society has needs, beliefs, institutions and its own history.'}</p><p class="mini"><b>Stellar adaptation:</b> ${starAdaptation(p)}. The ${starClass().key}-class star and its light spectrum influence exposure and evolutionary pace.</p><div class="tinyNote">Population estimates are playful simulation units, not a literal cell-by-cell or evolutionary forecast.</div></div><div class="sectionLabel">Life conditions</div><div class="grid2"><div class="stat"><small>Planetary habitat</small><strong>${habit(p)}%</strong></div><div class="stat"><small>Stellar radiation</small><strong style="font-size:14px">${radiationLabel(p)}</strong></div></div>${p.life<4?`<div class="card"><h3>Environmental needs</h3>${meter('Water',Math.min(100,p.water*1.14))}${meter('Nutrients',p.resources)}${meter('Suitable climate',habit(p))}<p class="mini">Microbes and animals need suitable conditions; happiness and cultural needs appear once a civilization emerges.</p></div>`:''}${p.life===4?`<div class="sectionLabel">People & needs</div><div class="card">${meter('Happiness',p.happiness)}${meter('Stability',p.stability)}${Object.entries(n).map(([k,v])=>meter(k[0].toUpperCase()+k.slice(1),v)).join('')}<p class="mini">Most pressing need: <strong class="${wanted[1]<45?'needBad':'needGood'}">${wanted[0]}</strong>. Civilizations respond to local conditions as time advances.</p></div><div class="sectionLabel">Society, beliefs & conflict</div><div class="card"><div class="row"><span class="mini">Species</span><strong>${esc(p.species||'Starborn')}</strong></div><div class="divider"></div><p><b>Culture:</b> ${esc(p.culture||'Emerging traditions')}</p><p><b>Religion:</b> ${esc(socialStory(p))}</p><p><b>Politics:</b> ${esc(politicalSystem(p))}</p><p><b>Conflict:</b> ${p.war>=50?'Open warfare':p.war>=25?'Rising tensions':'Relative peace'}</p>${meter('Conflict pressure',p.war)}</div>`:''}`}

function toast(msg){const el=$('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2900)}
function showToast(s){toast(s)}
function gainLife(p){if(p.life>0)return; p.life=1;p.lifeAge=0;p.pop=0;p.organisms=1e6;pushLog('The first microorganisms appeared on '+p.name+'.','life',p);toast('✧ Life begins on '+p.name)}
function advanceEvolution(p){if(p.life===0){gainLife(p);return}if(p.life<4){p.life++;p.lifeAge=0;p.organisms=p.life===2?500000:p.life===3?16000:0;if(p.life===4){p.pop=1200;p.civYears=0;p.tech=0;populateIdentity(p);pushLog('The '+civName(p)+' established their first settlements.','civilization',p);}else pushLog(p.name+' evolved into '+lifeText[p.life].toLowerCase()+'.','life',p);toast('✧ '+p.name+': '+lifeText[p.life]);}else {p.civYears+=10000;progressCivilization(p);toast('Divine inspiration advances '+civName(p))}}
function techFor(years){return years>=75000?5:years>=48000?4:years>=24000?3:years>=11000?2:years>=3500?1:0}
function progressCivilization(p){populateIdentity(p);const t=techFor(p.civYears);if(t>p.tech){for(let k=p.tech+1;k<=t;k++){pushLog('The '+civName(p)+' entered the '+techNames[k].toLowerCase()+'.','civilization',p)}p.tech=t;toast('✦ '+p.name+': '+techNames[t]);}}
function applyTime(dt){if(dt<=0||!state.star)return;state.year+=dt;for(const p of state.planets){const h=habit(p),radiation=starRadiation(p);if(p.life===0){p.abiogenesis=(p.abiogenesis||0)+dt*(h>=72?1:0);if(h>=72&&p.abiogenesis>220000000){gainLife(p);p.lifeAge=0}}else if(h<17){p.exposure=(p.exposure||0)+dt;if(p.exposure>40000000&&!p.protected){p.life=0;p.pop=0;p.organisms=0;p.tech=0;p.civYears=0;p.lifeAge=0;p.exposure=0;pushLog('A planetary collapse extinguished life on '+p.name+'.','disaster',p);continue}}else p.exposure=0;
if(p.life>0&&p.life<4){p.lifeAge+=dt*clamp(h/65,.15,1.4);const scale=p.life===1?3e8:p.life===2?500:50;let carrying=scale*(Math.max(.2,p.size)**2)*Math.max(.05,h/100)*(p.resources/65);let start=p.life===1?1e6:p.life===2?300:p.life===3?50:0;const growth=p.lifeAge/(p.life===1?6000000:p.life===2?12000000:24000000);p.organisms=Math.max(start,p.organisms||0,Math.round(Math.min(p.life===1?1e13:p.life===2?1e9:1e8,carrying*(1+Math.min(15000,growth**1.3))*Math.max(.1,1-Math.max(0,radiation-1)*.08))));let iters=0;while(p.life<4&&p.lifeAge>=evoThreshold(p)&&iters++<4){p.lifeAge-=evoThreshold(p);p.life++;p.organisms=p.life===2?500:p.life===3?50:0;if(p.life===4){p.pop=1200;p.civYears=0;p.tech=0;p.happiness=72;populateIdentity(p);pushLog('Civilization arose on '+p.name+'. The '+civName(p)+' began their history.','civilization',p)}else pushLog(p.name+' developed '+lifeText[p.life].toLowerCase()+'.','life',p)}}else if(p.life===4){populateIdentity(p);p.civYears+=dt;const needs=getNeeds(p),needAvg=Object.values(needs).reduce((a,b)=>a+b,0)/4;const growthRate=clamp((needAvg-35)/150,-.25,.44),years=clamp(dt/1000,0,35);p.pop=clamp(Math.round(Math.max(100,p.pop)*Math.exp(growthRate*years)),100,9800000000);p.happiness=clamp(p.happiness+(needAvg-p.happiness)*Math.min(1,dt/9000)-p.war*Math.min(1,dt/50000)*.18,0,100);p.stability=clamp(p.stability+(p.happiness-p.stability)*Math.min(.45,dt/120000)-p.war*Math.min(.4,dt/80000)*.06,0,100);p.war=clamp(p.war+(needs.food<25||needs.water<25?dt/1800:-dt/6500),0,100);if(p.war>58&&p.war<65)pushLog('Rising tensions challenge the '+civName(p)+'.','civilization',p);progressCivilization(p)}}checkFirstContact()}
function checkFirstContact(){let advanced=state.planets.filter(p=>p.life===4&&p.tech>=4);if(advanced.length<2)return;for(let i=0;i<advanced.length;i++)for(let j=i+1;j<advanced.length;j++){let [a,b]=[advanced[i],advanced[j]],key=[a.id,b.id].sort((x,y)=>x-y).join(':');if(!state.firstContacts.includes(key)){state.firstContacts.push(key);pushLog('FIRST CONTACT: '+civName(a)+' astronomers detected signals from '+civName(b)+'.','contact');launchEvent('contact',a,b,false)}}}
let pendingEvent=null;
function launchEvent(type=null,p=null,other=null,interactive=true){if(interactive&&pendingEvent)return;const w=p||selectedWorld()||pick(state.planets);if(!w){toast('Create a world to shape its destiny.');return}if(!type)type=w.life===4?pick(['prayer','discovery','meteor','famine']):pick(['meteor','discovery','anomaly']);const d={meteor:{badge:'COSMIC EVENT · HIGH STAKES',icon:'☄',title:'An Incoming Asteroid',story:'A massive asteroid is on course for '+w.name+'. The impact could reshape the planet and threaten everything living there.',opts:[['Shield the world','Turn the asteroid aside with divine force.','shield'],['Bless the survivors','Let the impact happen, but protect life.','protect'],['Let fate decide','A dangerous chance for an unexpected future.','fate']]},discovery:{badge:'CHANCE OPPORTUNITY',icon:'✧',title:'The Impossible Discovery',story:'Strange signals rise from '+w.name+'. An extraordinary discovery could change the future of this world.',opts:[['Illuminate the truth','Ensure a beneficial discovery.','illuminate'],['Encourage curiosity','A chance of a breakthrough or setback.','curiosity'],['Remain a silent god','Allow events to unfold independently.','silence']]},anomaly:{badge:'COSMIC ANOMALY',icon:'◈',title:'A Gift from the Void',story:'Unusual cosmic energy surrounds '+w.name+'. It could nourish an emerging biosphere — or disrupt it.',opts:[['Stabilize the energy','Ensure a gentle, life-giving effect.','stabilize'],['Channel the surge','Risk instability for a greater reward.','surge'],['Ignore the anomaly','Leave the universe to chance.','ignore']]},prayer:{badge:'DIVINE OPPORTUNITY',icon:'✦',title:'A World Calls Out',story:'The '+civName(w)+' are divided over a difficult future. Their prayers rise into the sky, whether or not they know you are listening.',opts:[['Answer with a miracle','Raise morale and their belief in you.','miracle'],['Gift knowledge','Accelerate their understanding of the cosmos.','knowledge'],['Remain silent','Allow their society to find its own answer.','silent']]},famine:{badge:'CIVILIZATION CRISIS',icon:'⚖',title:'The Scarcity Years',story:'A resource shortage threatens the '+civName(w)+'. Their future rests on both their choices and the forces of nature.',opts:[['Create abundance','Restore resources and social stability.','abundance'],['Inspire cooperation','Give them a chance to resolve the crisis.','cooperate'],['Do not intervene','Their choices will determine their fate.','nonintervene']]},contact:{badge:'FIRST CONTACT',icon:'✶',title:'Two Worlds, One Sky',story:'The '+civName(w)+' have detected another intelligent species on '+(other?.name||'a neighboring world')+'. Both societies are now wondering whether they are alone.',opts:[['Give them a shared language','Encourage peaceful contact and trust.','language'],['Grant superior technology','Give '+civName(w)+' a decisive advantage.','advantage'],['Observe their decisions','They may become friends — or rivals.','watch']]}}[type];if(!d)return;const event={...d,type,pid:w.id,other:other?.id,id:state.nextEventId++};if(!interactive){if(state.eventInbox.length<12){state.eventInbox.unshift(event);updateEventBadge();scheduleSave()}return}pendingEvent=event;renderEvent()}
function updateEventBadge(){const b=$('eventCount');if(!b)return;b.textContent=state.eventInbox.length;b.hidden=state.eventInbox.length===0}
function renderEvent(){if(!pendingEvent){$('eventVeil').classList.remove('show');return}let e=pendingEvent;$('eventCard').innerHTML=`<div class="eyebrow">${e.badge}</div><div style="font-size:48px;margin-top:15px">${e.icon}</div><h2>${esc(e.title)}</h2><p>${esc(e.story)}</p><div class="pill ${state.plotArmor?'good':''}">${state.plotArmor?'☘ Plot Armor ON · Lucky outcomes guaranteed':'⚄ Fate is unpredictable'}</div><div class="eventOptions">${e.opts.map(o=>`<button data-event="${o[2]}"><strong>${esc(o[0])} ›</strong><span>${esc(o[1])}</span></button>`).join('')}</div>`;$('eventVeil').classList.add('show')}
function resolveEvent(action){const e=pendingEvent;if(!e)return;const p=world(e.pid);if(!p){pendingEvent=null;$('eventVeil').classList.remove('show');toast('That world no longer exists.');return}let good=state.plotArmor||Math.random()<.58,summary='',type='cosmos';switch(action){case'shield':p.protected=1;summary='You deflected the asteroid. '+p.name+' is safe.';break;case'protect':p.resources=clamp(p.resources-8,0,100);p.protected=1;summary='The asteroid struck, but you preserved life on '+p.name+'.';break;case'fate':case'ignore':case'nonintervene':case'watch':case'silence':case'silent':if(good){p.resources=clamp(p.resources+11,0,100);p.stability=clamp(p.stability+7,0,100);summary=p.name+' overcame uncertainty and emerged stronger.'}else{p.resources=clamp(p.resources-16,0,100);p.stability=clamp(p.stability-15,0,100);summary='Without intervention, '+p.name+' endured a painful setback.';type='disaster'}break;case'illuminate':case'stabilize':p.resources=clamp(p.resources+15,0,100);summary='You channeled the anomaly into an extraordinary blessing.';break;case'curiosity':case'surge':if(good){p.resources=clamp(p.resources+25,0,100);if(p.life===0&&habit(p)>35)gainLife(p);summary='A rare breakthrough transformed '+p.name+'.'}else{p.tempBias+=14;p.stability=clamp(p.stability-9,0,100);summary='The cosmic surge destabilized '+p.name+'.';type='disaster'}break;case'miracle':p.faith=clamp(p.faith+22,0,100);p.stability=clamp(p.stability+20,0,100);summary='A miracle united the '+civName(p)+' in wonder.';break;case'knowledge':p.civYears+=18000;progressCivilization(p);p.faith=clamp(p.faith+8,0,100);summary='Knowledge from their creator accelerated the '+civName(p)+'.';break;case'abundance':p.resources=100;p.stability=clamp(p.stability+15,0,100);summary='You turned scarcity into abundance.';break;case'cooperate':if(good){p.stability=clamp(p.stability+19,0,100);summary='The '+civName(p)+' forged a fair solution together.'}else{p.stability=clamp(p.stability-17,0,100);summary='Negotiations failed, and instability spread.';type='disaster'}break;case'language':p.stability=clamp(p.stability+14,0,100);p.faith=clamp(p.faith+8,0,100);summary='You gave two worlds the gift of understanding.';break;case'advantage':p.civYears+=25000;progressCivilization(p);summary='You accelerated the '+civName(p)+' beyond their neighbors.';break;default:summary='The cosmos continues.'}
pushLog(summary,type,p);pendingEvent=null;$('eventVeil').classList.remove('show');state.eventsSeen++;updateEventBadge();toast(summary);renderSheet();updateHUD()}
function addPlanet(kind){if(!state.star){toast('Ignite a star before creating worlds.');return}if(state.planets.length>=12){toast('This solar system supports up to 12 planets.');return}let distances=state.planets.map(p=>p.distance),distance=distances.length?Math.max(...distances)+rnd(.28,.45):.75;distance=clamp(distance,.35,3.5);if(distances.includes(3.5)){distance=clamp(.38+Math.random()*2.8,.35,3.5)}let n=names.find(n=>!state.planets.some(p=>p.name===n))||'World '+state.counter,p=planetOf(n,kind,distance);if(kind==='garden'){p.distance=1;p.water=58;p.atmosphere=78;p.resources=84}if(kind==='ocean'){p.water=78;p.atmosphere=88}if(kind==='ice')p.tempBias=-35;if(kind==='volcanic')p.tempBias=85;state.planets.push(p);selected=p.id;pushLog(p.name+' formed in the solar system.','cosmos',p);toast('✦ Created '+p.name);renderSheet();updateHUD();scheduleSave()}
function addMoon(p){if(p.moons>=5){toast('Moon limit reached for this world.');return}p.moons++;pushLog('A new moon formed around '+p.name+'.','cosmos',p);toast('A moon joins '+p.name);renderSheet()}
function usePower(name,id){let p=world(id)||selectedWorld();if(!p&&name!=='comet'){toast('Select a planet first.');return}switch(name){case'life':if(habit(p)<20)toast('This world is harsh; try terraforming to sustain life.');gainLife(p);break;case'evolve':advanceEvolution(p);break;case'space':if(p.life<4){p.life=4;p.pop=1200;pushLog('You awakened a civilization on '+p.name+'.','civilization',p)}p.civYears=Math.max(p.civYears,90000);progressCivilization(p);checkFirstContact();break;case'oceans':p.water=clamp(p.water+25,0,100);pushLog('Divine oceans reshaped '+p.name+'.','divine',p);break;case'air':p.atmosphere=clamp(p.atmosphere+25,0,100);pushLog('A breathable atmosphere spread across '+p.name+'.','divine',p);break;case'warm':p.tempBias=clamp(p.tempBias+15,-180,180);pushLog('You warmed '+p.name+'.','divine',p);break;case'cool':p.tempBias=clamp(p.tempBias-15,-180,180);pushLog('You cooled '+p.name+'.','divine',p);break;case'resources':p.resources=100;pushLog('You filled '+p.name+' with abundant resources.','divine',p);break;case'bless':p.stability=100;p.faith=clamp(p.faith+25,0,100);p.protected=1;pushLog('You blessed '+p.name+' with protection and prosperity.','divine',p);break;case'calamity':p.resources=clamp(p.resources-30,0,100);p.stability=clamp(p.stability-30,0,100);p.tempBias=clamp(p.tempBias+18,-180,180);pushLog('Divine fire and upheaval descended upon '+p.name+'.','disaster',p);break;case'extinction':p.life=0;p.pop=0;p.civYears=0;p.tech=0;p.lifeAge=0;pushLog('You erased all life from '+p.name+'.','disaster',p);break;case'moon':addMoon(p);return;case'comet':launchEvent('meteor',p);return;case'event':launchEvent(null,p);return;default:return}toast('✦ Divine power: '+name);checkFirstContact();renderSheet();updateHUD();scheduleSave()}
function panel(p){sheetPanel=p;$('sheet').classList.add('open');$('veil').classList.add('visible');document.querySelectorAll('.tool').forEach(el=>el.classList.toggle('active',el.dataset.panel===p));renderSheet()}
function closePanel(){sheetPanel=null;$('sheet').classList.remove('open');$('veil').classList.remove('visible');document.querySelectorAll('.tool').forEach(el=>el.classList.remove('active'))}
function button(label,act,opts=''){return `<button class="action ${opts}" data-action="${act}">${label}</button>`}
function power(label,desc,name,p){return `<div class="card"><h3>${label}</h3><p>${desc}</p><button class="action secondary full" data-action="power" data-power="${name}" data-id="${p?.id??''}">Invoke power ↗</button></div>`}
function slider(label,key,val,min,max,step='1',suffix=''){return `<div class="field"><label>${label}<strong class="number" id="val-${key}">${key==='tempBias'&&state.tempUnit==='F'?Math.round(Number(val)*9/5)+'°F':Number(val).toFixed(Number(step)<1?(Number(step)<=.05?2:1):0)+suffix}</strong></label><input aria-label="${label}" type="range" data-change="${key}" min="${min}" max="${max}" step="${step}" value="${val}" data-suffix="${suffix}"></div>`}
function worldCard(p){return `<div class="card"><div class="bodyhead"><h3><span class="swatch" style="background:${colors[p.kind]||'#aab'}"></span>${esc(p.name)}</h3><span class="pill ${habit(p)>65?'good':''}">${habLabel(p)}</span></div><p>${p.distance.toFixed(2)} AU · ${lifeText[p.life]}${p.life?' · '+popText(lifeCount(p)):''} · ${tempLabel(temperature(p))}</p><div class="progress"><span style="width:${habit(p)}%"></span></div><div style="height:11px"></div><button class="action secondary full" data-action="inspect" data-id="${p.id}">Inspect ${esc(p.name)} ↗</button></div>`}
function selectedHint(){return `<div class="hint">Select a planet on the star map, or choose one from <b>Worlds</b> to use this power.</div>`}
function renderSheet(){if(!sheetPanel)return;const p=selectedWorld(),star=state.star;let name='',eyebrow='DIVINE CONTROL',html='';switch(sheetPanel){
case'create':name='Creation';eyebrow='LET THERE BE LIGHT';html=`<p class="lead">You are the creator. Shape a star, summon new worlds, and build the cosmic playground your civilizations will call home.</p>${!star?button('✦ Ignite your first star','ignite','full'):`<div class="card"><div class="bodyhead"><h3>☀ ${esc(star.name)}</h3><span class="pill good">Star active</span></div><p>${fmt(state.planets.length)} planets in orbit · ${starClass().key}-class · ${star.mass.toFixed(2)} solar masses · ${starLight().toFixed(1)}× sunlight</p><button class="action secondary full" data-action="star">Shape your star ↗</button></div>`}<div class="sectionLabel">Summon a planet · ${state.planets.length}/12</div><div class="grid2">${[['garden','🌿','Garden world','Balanced and temperate'],['ocean','🌊','Ocean world','Deep seas and clouds'],['rock','🪨','Rock world','Barren and mineral rich'],['desert','🏜','Desert world','Dry with hardy terrain'],['ice','❄','Ice world','Frozen and distant'],['volcanic','🌋','Volcanic world','Hot and volatile'],['gas','🪐','Gas giant','A storm-wrapped giant']].map(([kind,icon,title,description])=>`<button class="card" style="text-align:left;margin:0" data-action="create-world" data-kind="${kind}" ${state.planets.length>=12?'disabled':''}><span class="icon">${icon}</span><h3 style="font-size:15px;margin:7px 0 2px">${title}</h3><p style="margin:0">${description}</p></button>`).join('')}</div><p class="footer">Planets are stylized. Climate and orbital rules are simplified for sandbox play, not an astronomical prediction.</p>`;break;
case'worlds':name='Your Worlds';eyebrow='THE COSMOS';html=`<p class="lead">Every world is yours to nurture, reshape, or destroy. Tap its orbiting body or inspect it here.</p><div class="grid2"><div class="stat"><small>Planets</small><strong>${state.planets.length}</strong></div><div class="stat"><small>Living worlds</small><strong>${state.planets.filter(x=>x.life>0).length}</strong></div></div><div style="height:14px"></div>${state.planets.map(worldCard).join('')||'<div class="empty">Your universe is empty. Create your first planet.</div>'}${button('✦ Create a world','open-create','full')}`;break;
case'inspect':if(!p){sheetPanel='worlds';return renderSheet()}name=p.name;eyebrow='WORLD INSPECTOR';html=`<div class="row"><span class="pill ${habit(p)>=48?'good':'bad'}">${habLabel(p)} · ${habit(p)}%</span><span class="pill blue">${lifeText[p.life]}</span></div><p class="lead" style="margin-top:12px">${p.kind[0].toUpperCase()+p.kind.slice(1)} world · ${p.moons} moon${p.moons===1?'':'s'} · ${p.distance.toFixed(2)} AU from ${esc(star.name)}</p><div class="grid2"><div class="stat"><small>Climate</small><strong>${tempLabel(temperature(p))}</strong></div><div class="stat"><small>Habitability</small><strong>${habit(p)}%</strong></div><div class="stat"><small>Life</small><strong style="font-size:13px">${lifeText[p.life]}</strong></div><div class="stat"><small>Resources</small><strong>${Math.round(p.resources)}%</strong></div></div><div class="sectionLabel">Planetary properties</div><div class="field"><label>Name this world</label><input type="text" maxlength="24" data-change="name" value="${esc(p.name)}"></div>${slider('Orbital distance','distance',p.distance,.35,3.5,.05,' AU')}${slider('Planet size','size',p.size,.5,2,.1,'×')}${slider('Temperature offset','tempBias',p.tempBias,-180,180,1,'°C')}${slider('Water coverage','water',p.water,0,100,1,'%')}${slider('Atmosphere','atmosphere',p.atmosphere,0,100,1,'%')}${slider('Resources','resources',p.resources,0,100,1,'%')}<div class="grid2">${button('☽ Add moon','moon','secondary')}${button('☄ Fate event','invoke-event','secondary')}</div><div class="sectionLabel">Life & society</div>${lifeDashboard(p)}<p class="mini">${p.life===4?`The ${esc(civName(p))} · ${techNames[p.tech]} · ${fmt(p.pop)} people · stability ${Math.round(p.stability)}%`:`Life stage: ${lifeText[p.life]}. ${p.life?'Age of current stage: '+yearLabel(p.lifeAge):'Awaiting creation.'}`}</p><div class="divider"></div>${button('Erase this planet','delete-world','danger full')}`;break;
case'star':if(!star){sheetPanel='create';return renderSheet()}name=star.name;eyebrow='STELLAR FORGE';html=`<p class="lead">Your star shapes every world. Mass determines spectral class and baseline brightness; luminosity and radiation affect planetary climate, habitability, and how fast life can diversify.</p><div class="card"><h3>☀ ${esc(star.name)}</h3><div class="grid2"><div class="stat"><small>Spectral class</small><strong>${starClass().key} · ${starClass().name}</strong></div><div class="stat"><small>Actual light</small><strong>${starLight().toFixed(2)}× Sol</strong></div><div class="stat"><small>Mass</small><strong>${star.mass.toFixed(2)} M☉</strong></div><div class="stat"><small>Est. lifetime</small><strong style="font-size:13px">${yearLabel(1e10/Math.pow(star.mass,2.5))}</strong></div></div></div><div class="field"><label>Star name</label><input type="text" maxlength="24" data-change="starname" value="${esc(star.name)}"></div><div class="field"><label>Spectral class preset</label><select class="selectControl" data-change="starclass">${STAR_CLASSES.map(c=>`<option value="${c.key}" ${starClass().key===c.key?'selected':''}>${c.key} — ${c.name}</option>`).join('')}</select></div>${slider('Stellar mass','mass',star.mass,.35,3,.05,' M☉')}${slider('Luminosity multiplier','lum',star.lum,.35,2.5,.05,'×')}${slider('Star color / light tint','hue',star.hue,0,360,1,'°')}<div class="hint">Scientific inspiration, simplified for play: heavier, bluer stars generally burn brighter with stronger UV and shorter lifetimes. Color tint also affects the game's light spectrum. ${starClass().key}-class light changes radiation exposure and evolution on your worlds.</div>${button('Return to creation','open-create','secondary full')}`;break;
case'life':name='Life & Evolution';eyebrow='THE LIVING COSMOS';html='<p class="lead">See population, growth, environmental needs and the social history of each species. Life can grow naturally as universal time passes.</p>';
if(!p){html+=selectedHint();break}html+=`<div class="card"><h3>❧ ${esc(p.name)}</h3><p>${p.life===4?`${esc(civName(p))} · ${popText(p.pop)} people · ${techNames[p.tech]}`:p.life?`${popText(lifeCount(p))} organisms · current stage age ${yearLabel(p.lifeAge)}`:'No organisms inhabit this world yet.'}</p></div>${lifeDashboard(p)}<div class="sectionLabel">Divine influence</div><div class="stack">${button('✧ Spark life','spark','full')}${button('❧ Advance evolution','evolve','secondary full')}${button('✶ Awaken a spacefaring civilization','gift-space','secondary full')}</div>`;break;
case'powers':name='Divine Powers';eyebrow='YOU ARE THE CREATOR';html=`<p class="lead">Unlimited intervention. Bless your creations, transform hostile worlds, tempt fate, or unleash catastrophe.</p>${!p?selectedHint():`<div class="pill blue">Target: ${esc(p.name)}</div><div class="sectionLabel">Nurture & reshape</div><div class="grid2">${[['🌊 Oceans','oceans'],['☁ Atmosphere','air'],['☀ Warm world','warm'],['❄ Cool world','cool'],['◇ Resources','resources'],['✧ Bless world','bless'],['☽ Create moon','moon'],['❧ Evolve life','evolve']].map(([n,k])=>`<button class="action secondary" data-action="power" data-power="${k}">${n}</button>`).join('')}</div><div class="sectionLabel">Destiny & destruction</div><div class="stack">${button('⚄ Invoke random encounter','invoke-event','ghost full')}${button('☄ Summon an asteroid','meteor','secondary full')}${button('⚡ Unleash calamity','calamity','danger full')}${button('◈ Extinguish all life','extinction','danger full')}</div>`}<div class="divider"></div><div class="row"><div><b style="font-size:14px">☘ Plot Armor Mode</b><p class="mini">Guarantees good luck when leaving divine events to chance.</p></div><input style="width:23px;height:23px" type="checkbox" data-change="plotArmor" ${state.plotArmor?'checked':''} aria-label="Plot Armor Mode"></div>`;break;
case'events':name='Event Inbox';eyebrow='YOUR UNIVERSE, YOUR PACE';html=`<p class="lead">Events collect quietly here while you create and explore. Open one when you feel like intervening; nothing will interrupt your menus or reading.</p><div class="eventNotice">✉ ${state.eventInbox.length} awaiting your attention · Automatic events never force a popup.</div>${state.eventInbox.map(e=>`<div class="miniEvent"><div class="eyebrow">${esc(e.badge)}</div><h3>${esc(e.icon)} ${esc(e.title)}</h3><p>${esc(e.story)}</p><div class="grid2"><button class="action secondary" data-action="read-event" data-id="${e.id}">Choose what happens</button><button class="action ghost" data-action="dismiss-event" data-id="${e.id}">Leave to fate</button></div></div>`).join('')||'<div class="empty">All quiet in your cosmos. Events will appear here as you play.</div>'}<p class="tinyNote">Leaving an event to fate uses Plot Armor if enabled.</p>`;break;
case'history':name='The Chronicle';eyebrow='EVERY GOD LEAVES A STORY';html=`<p class="lead">The written history of your creation. Civilizations remember significant events, even after thousands of years.</p><div class="grid2">${button('↓ Export history','export-history','secondary')}${button('⚄ Create a story event','invoke-event','ghost')}</div><div class="sectionLabel">${state.log.length} recorded events</div>${state.log.map(e=>`<div class="entry"><small>✦ YEAR ${esc(yearLabel(e.year))} · ${esc(e.type.toUpperCase())}</small><p>${esc(e.message)}</p></div>`).join('')||'<div class="empty">The cosmos awaits its first story.</div>'}`;break;
case'time':name='Universal Time';eyebrow='TIME BENDS TO YOUR WILL';html=`<p class="lead">Watch empires rise in moments, or pause everything to perfect a world. Skip across geological eras in an instant.</p><div class="card"><div class="eyebrow">ELAPSED TIME</div><h3 style="font-size:26px;margin:9px 0">${yearLabel(state.year)}</h3><p>Time dilation in this game is an artistic simulation. Orbits animate independently for comfortable viewing.</p></div><div class="sectionLabel">Flow of time</div><div class="grid3">${[[0,'Ⅱ Pause'],[1,'▶ 1×'],[10,'▶▶ 10×'],[100,'↠ 100×'],[1000,'⏩ 1000×']].map(([s,n])=>`<button class="action ${state.speed===s?'':'secondary'}" data-action="speed" data-speed="${s}">${n}</button>`).join('')}</div><div class="sectionLabel">Leap through the ages</div><div class="grid2">${[[1000,'+ 1,000 years'],[100000,'+ 100,000 years'],[10000000,'+ 10 million years'],[100000000,'+ 100 million years']].map(([n,label])=>`<button class="action secondary" data-action="leap" data-years="${n}">${label}</button>`).join('')}</div><div class="hint">Tip: Create life, advance 100 million years, and check on your world. Or tap “Advance evolution” for instantaneous divine intervention.</div>`;break;
case'settings':name='Your Universe';eyebrow='ETERNAL OPTIONS';html=`<div class="field"><label>Universe name</label><input type="text" maxlength="28" data-change="universe-name" value="${esc(state.name)}"></div><div class="field"><label>Temperature units</label><select class="selectControl" data-change="tempUnit"><option value="C" ${state.tempUnit==='C'?'selected':''}>Celsius (°C)</option><option value="F" ${state.tempUnit==='F'?'selected':''}>Fahrenheit (°F)</option></select></div><div class="eventNotice">✉ Ambient encounters wait in your Event Inbox. Your tools and menus are never interrupted.</div><div class="row"><div><b style="font-size:14px">Ambient encounters</b><p class="mini">Collect surprise encounters while the universe runs. Turn off for uninterrupted creative play.</p></div><input style="width:23px;height:23px" type="checkbox" data-change="ambientEvents" ${state.ambientEvents?'checked':''} aria-label="Ambient encounters"></div><div class="stack">${button('↧ Save now','save','full')}${button('↓ Export universe backup','export','secondary full')}${button('↑ Import saved universe','import','secondary full')}${button('⌖ Recenter map','center','secondary full')}</div><div class="divider"></div><div class="row"><div><b>☘ Plot Armor Mode</b><p class="mini">Fate always rewards risky divine-event decisions.</p></div><input style="width:23px;height:23px" type="checkbox" data-change="plotArmor" ${state.plotArmor?'checked':''} aria-label="Plot Armor Mode"></div><div class="sectionLabel">New beginning</div>${button('Start a blank universe','blank','danger full')}<p class="footer">GENESIS · The First Light · Version 0.2 · Mobile HTML sandbox. This game uses simplified systems designed for fun, not a scientific model of life or planetary physics. Saves are local to this browser and site; export a backup if you switch phones or browsers.</p>`;break;}
$('sheetTitle').textContent=name;$('sheetEyebrow').textContent=eyebrow;$('sheetBody').innerHTML=html;}
function updateHUD(){updateEventBadge();let p=selectedWorld();$('yearText').textContent='Age · '+yearLabel(state.year);$('worldText').textContent=state.planets.length+' worlds · '+state.planets.filter(x=>x.life>0).length+' with life · '+(state.speed?'▶ '+state.speed+'×':'Ⅱ paused');$('selection').innerHTML=p?`<div><div class="eyebrow">SELECTED WORLD</div><h3><span class="swatch" style="background:${colors[p.kind]}"></span>${esc(p.name)}</h3><div class="muted">${habit(p)}% habitable · ${lifeText[p.life]}${p.life?' · '+popText(lifeCount(p)):''} · ${tempLabel(temperature(p))}</div></div><button data-action="inspect" data-id="${p.id}">Inspect ↗</button>`:state.star?`<div><div class="eyebrow">THE STELLAR FORGE</div><h3>☀ ${esc(state.star.name)}</h3><div class="muted">${state.planets.length} worlds orbit your star</div></div><button data-action="open" data-panel="create">✦ Create</button>`:`<div><div class="eyebrow">BEFORE THE FIRST LIGHT</div><h3>Only the void remains</h3><div class="muted">Create your universe</div></div><button data-action="ignite">Ignite ↗</button>`;}
function renderBackdrop(){let w=view.w,h=view.h;let gradient=ctx.createRadialGradient(w*.45,h*.4,10,w*.45,h*.42,Math.max(w,h)*.87);gradient.addColorStop(0,'#111d36');gradient.addColorStop(.6,'#090e20');gradient.addColorStop(1,'#050812');ctx.fillStyle=gradient;ctx.fillRect(0,0,w,h);ctx.save();let neb=ctx.createRadialGradient(w*.4,h*.48,2,w*.4,h*.45,w*.65);neb.addColorStop(0,'#35426f18');neb.addColorStop(1,'#151c4600');ctx.fillStyle=neb;ctx.fillRect(0,0,w,h);for(let i=0;i<220;i++){const x=((i*127.13+i*i*4.31)%1093)/1093*w,y=((i*i*71.13+i*19.7)%719)/719*h,r=(i%19===0?1.4:.5),t=.38+(Math.sin(now*.6+i)*.16);ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=`rgba(221,231,255,${t})`;ctx.fill()}ctx.restore()}
function spaceCenter(){return{x:view.w*.5+camera.x,y:view.h*.40+camera.y}}
function location(p){const center=spaceCenter();const r=p.distance*77*camera.zoom;let a=p.angle+now*.28/Math.pow(p.distance,1.5);return{x:center.x+Math.cos(a)*r,y:center.y+Math.sin(a)*r}}
function drawSphere(x,y,r,c){let g=ctx.createRadialGradient(x-r*.37,y-r*.43,r*.1,x,y,r*1.15);g.addColorStop(0,'#eef8ff');g.addColorStop(.13,c);g.addColorStop(.78,c);g.addColorStop(1,'#0b1836');ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();ctx.strokeStyle='#d5e5ff55';ctx.lineWidth=.7;ctx.stroke()}
function draw(){if(view.w===0)return;ctx.setTransform(view.dpr,0,0,view.dpr,0,0);renderBackdrop();let c=spaceCenter();if(state.star){ctx.save();for(const p of state.planets){const r=p.distance*77*camera.zoom;ctx.beginPath();ctx.ellipse(c.x,c.y,r,r,0,0,Math.PI*2);ctx.strokeStyle=p.id===selected?'#e6c68a73':'#9aadd32b';ctx.lineWidth=p.id===selected?1.15:.85;ctx.stroke();}const sr=clamp(17*camera.zoom*Math.pow(state.star.mass||1,.42),6,49);const halo=ctx.createRadialGradient(c.x,c.y,1,c.x,c.y,sr*4.8);halo.addColorStop(0,`hsla(${state.star.hue},95%,67%,.62)`);halo.addColorStop(.22,`hsla(${state.star.hue},95%,55%,.24)`);halo.addColorStop(1,`hsla(${state.star.hue},95%,45%,0)`);ctx.fillStyle=halo;ctx.beginPath();ctx.arc(c.x,c.y,sr*4.8,0,Math.PI*2);ctx.fill();drawSphere(c.x,c.y,sr,`hsl(${state.star.hue},94%,66%)`);ctx.textAlign='center';ctx.fillStyle=`hsl(${state.star.hue},94%,85%)`;ctx.font='10px system-ui';ctx.fillText(state.star.name,c.x,c.y+sr+14);for(const p of state.planets){let {x,y}=location(p),r=clamp((7+p.size*3.2)*Math.sqrt(camera.zoom),5,23);if(p.kind==='gas')r*=1.35;if(p.id===selected){ctx.beginPath();ctx.arc(x,y,r+7,0,Math.PI*2);ctx.strokeStyle='#dcd18fbb';ctx.setLineDash([3,3]);ctx.lineWidth=1.15;ctx.stroke();ctx.setLineDash([])}drawSphere(x,y,r,colors[p.kind]||'#b1a5bb');if(['ocean','garden'].includes(p.kind)){ctx.save();ctx.beginPath();ctx.arc(x,y,r*.93,0,Math.PI*2);ctx.clip();ctx.fillStyle='#6ca87988';for(let j=0;j<3;j++){let yy=y+(j-1)*r*.48;ctx.beginPath();ctx.ellipse(x+Math.sin(p.id*11+j)*r*.35,yy,r*.33,r*.17,p.angle+j,0,Math.PI*2);ctx.fill()}ctx.restore()}if(p.kind==='gas'){ctx.strokeStyle='#dbbd9cbb';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(x,y,r*1.48,r*.48,-.25,0,Math.PI*2);ctx.stroke()}if(p.life>0){ctx.fillStyle='#81e5ae';ctx.beginPath();ctx.arc(x+r*.8,y-r*.9,2.2,0,Math.PI*2);ctx.fill()}if(p.moons){for(let j=0;j<Math.min(p.moons,5);j++){let a=now*.8+j*Math.PI*2/p.moons+p.id;ctx.fillStyle='#c6bdaf';ctx.beginPath();ctx.arc(x+Math.cos(a)*(r+9+j*2),y+Math.sin(a)*(r+9+j*2),Math.max(1.4,r*.15),0,Math.PI*2);ctx.fill()}}ctx.font=p.id===selected?'bold 11px system-ui':'10px system-ui';ctx.textAlign='center';ctx.fillStyle=p.id===selected?'#ffe5ae':'#c1cada';ctx.fillText(p.name,x,y+r+17)}ctx.restore()}else{ctx.fillStyle='#dfccac';ctx.textAlign='center';ctx.font='22px Georgia,serif';ctx.fillText('Before there was light…',view.w/2,view.h*.4);ctx.font='13px system-ui';ctx.fillStyle='#aab6d0';ctx.fillText('Ignite a star to begin.',view.w/2,view.h*.4+27)}}
function resize(){let dpr=Math.min(devicePixelRatio||1,2),w=window.innerWidth,h=window.innerHeight;view={w,h,dpr};canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);canvas.style.width=w+'px';canvas.style.height=h+'px';}
function hit(x,y){let candidates=state.planets.map(p=>({p,...location(p)})).filter(o=>Math.hypot(o.x-x,o.y-y)<Math.max(16,13*Math.sqrt(camera.zoom)+o.p.size*2));candidates.sort((a,b)=>Math.hypot(a.x-x,a.y-y)-Math.hypot(b.x-x,b.y-y));if(candidates.length)return candidates[0].p;if(Math.hypot(spaceCenter().x-x,spaceCenter().y-y)<Math.max(23,17*camera.zoom))return 'star';return null}
function zoomBy(f,px=view.w/2,py=view.h*.4){let old=camera.zoom,next=clamp(old*f,.48,3.4);let c=spaceCenter();camera.x=px-view.w*.5-(px-c.x)*next/old;camera.y=py-view.h*.4-(py-c.y)*next/old;camera.zoom=next}
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(activePointers.size===1){drag={x:e.clientX,y:e.clientY,origX:camera.x,origY:camera.y,moved:false}}else if(activePointers.size===2){let pts=[...activePointers.values()];pinchStart={dist:Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y),zoom:camera.zoom};drag=null}});
canvas.addEventListener('pointermove',e=>{if(!activePointers.has(e.pointerId))return;activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(activePointers.size>=2&&pinchStart){let pts=[...activePointers.values()],dist=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);let mid={x:(pts[0].x+pts[1].x)/2,y:(pts[0].y+pts[1].y)/2};zoomBy(clamp(pinchStart.zoom*dist/Math.max(1,pinchStart.dist),.48,3.4)/camera.zoom,mid.x,mid.y);return}if(drag){let dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>8)drag.moved=true;camera.x=drag.origX+dx;camera.y=drag.origY+dy}});
function finishPointer(e){if(!activePointers.has(e.pointerId))return;const wasTap=activePointers.size===1&&drag&&!drag.moved;activePointers.delete(e.pointerId);pinchStart=null;if(wasTap){const x=e.clientX,y=e.clientY,found=hit(x,y);if(found==='star'){selected=null;panel('star')}else if(found){selected=found.id;updateHUD();toast('Selected '+found.name)}else{selected=null;updateHUD()}}drag=null}
canvas.addEventListener('pointerup',finishPointer);canvas.addEventListener('pointercancel',finishPointer);canvas.addEventListener('wheel',e=>{e.preventDefault();zoomBy(e.deltaY<0?1.1:.9,e.clientX,e.clientY)},{passive:false});
function download(name,text,type){const blob=new Blob([text],{type});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000)}
function act(el){const a=el.dataset.action;let p=selectedWorld();switch(a){case'close':closePanel();break;case'open':panel(el.dataset.panel);break;case'read-event':{const id=Number(el.dataset.id),index=state.eventInbox.findIndex(e=>e.id===id);if(index>=0){pendingEvent=state.eventInbox.splice(index,1)[0];updateEventBadge();scheduleSave();renderEvent()}break}case'dismiss-event':{const id=Number(el.dataset.id),index=state.eventInbox.findIndex(e=>e.id===id);if(index>=0){pendingEvent=state.eventInbox.splice(index,1)[0];resolveEvent('silence');renderSheet()}break}case'open-create':panel('create');break;case'inspect':selected=Number(el.dataset.id);panel('inspect');updateHUD();break;case'create-world':addPlanet(el.dataset.kind);break;case'ignite':state.star={name:'Sol',lum:1,hue:40,mass:1};pushLog('You ignited Sol in the darkness.');renderSheet();updateHUD();toast('✦ Let there be light!');break;case'star':selected=null;panel('star');updateHUD();break;case'power':usePower(el.dataset.power,el.dataset.id);break;case'spark':usePower('life',p?.id);break;case'evolve':usePower('evolve',p?.id);break;case'gift-space':usePower('space',p?.id);break;case'moon':usePower('moon',p?.id);break;case'meteor':launchEvent('meteor',p);break;case'invoke-event':launchEvent(null,p);break;case'calamity':usePower('calamity',p?.id);break;case'extinction':if(confirm('Extinguish all life on '+p?.name+'?'))usePower('extinction',p?.id);break;case'delete-world':if(p&&confirm('Erase '+p.name+' and its history from the star map?')){state.planets=state.planets.filter(w=>w.id!==p.id);state.eventInbox=state.eventInbox.filter(e=>e.pid!==p.id&&e.other!==p.id);updateEventBadge();pushLog('You erased '+p.name+' from existence.','disaster');selected=state.planets[0]?.id??null;panel('worlds');updateHUD();toast('World erased.')}break;case'speed':state.speed=Number(el.dataset.speed);renderSheet();updateHUD();scheduleSave();break;case'leap':applyTime(Number(el.dataset.years));renderSheet();updateHUD();toast('⏳ Advanced '+yearLabel(Number(el.dataset.years)));break;case'zoom-in':zoomBy(1.25);break;case'zoom-out':zoomBy(.8);break;case'center':camera={x:0,y:0,zoom:1};toast('Centered your cosmos');break;case'save':if(save())toast('✓ Universe saved on this device');break;case'export':save();download('genesis-universe-'+Date.now()+'.json',JSON.stringify(state,null,2),'application/json');toast('Universe backup exported');break;case'import':$('importFile').click();break;case'export-history':download('genesis-chronicle.txt','GENESIS — '+state.name+'\n\n'+state.log.slice().reverse().map(e=>'Year '+yearLabel(e.year)+' ['+e.type+'] '+e.message).join('\n'),'text/plain;charset=utf-8');toast('Chronicle exported');break;case'blank':if(confirm('Begin a NEW, EMPTY universe? Export a backup first if you want to keep this one.')){state=baseState();selected=null;pendingEvent=null;updateEventBadge();closePanel();save();updateHUD();toast('A new universe awaits your first light.')}break;}}
document.addEventListener('click',e=>{let t=e.target.closest('[data-action]');if(t){act(t);return}let ev=e.target.closest('[data-event]');if(ev)resolveEvent(ev.dataset.event)});
document.addEventListener('input',e=>{let t=e.target;if(t.matches('input[type=range][data-change]')){let o=$('val-'+t.dataset.change);if(o)o.textContent=t.dataset.change==='tempBias'&&state.tempUnit==='F'?Math.round(Number(t.value)*9/5)+'°F':Number(t.value).toFixed(Number(t.step)<1?(Number(t.step)<=.05?2:1):0)+(t.dataset.suffix||'')}});
document.addEventListener('change',e=>{let t=e.target,key=t.dataset.change,p=selectedWorld();if(!key)return;if(key==='ambientEvents'){state.ambientEvents=t.checked;toast(state.ambientEvents?'Ambient encounters enabled':'Ambient encounters paused');scheduleSave();return}if(key==='plotArmor'){state.plotArmor=t.checked;toast(state.plotArmor?'☘ Plot Armor enabled':'Fate is unpredictable again');renderSheet();scheduleSave();return}if(key==='tempUnit'){state.tempUnit=t.value;renderSheet();updateHUD();scheduleSave();return}if(key==='universe-name'){state.name=t.value.trim().slice(0,28)||'Untitled universe'}else if(key==='starname'&&state.star){state.star.name=t.value.trim().slice(0,24)||'Sol';renderSheet()}else if(key==='starclass'&&state.star){const st=STAR_CLASSES.find(c=>c.key===t.value);if(st){state.star.mass=st.mass;state.star.hue=st.hue;renderSheet();pushLog('You reshaped '+state.star.name+' into a '+st.name+'.','divine')}}else if(['lum','mass','hue'].includes(key)&&state.star){const bounds={lum:[.35,2.5],mass:[.35,3],hue:[0,360]};state.star[key]=clamp(Number(t.value),...bounds[key]);renderSheet();pushLog('You changed '+state.star.name+': '+key+'.','divine')}else if(p){if(key==='name'){p.name=t.value.trim().slice(0,24)||'Unnamed world';pushLog('A world was named '+p.name+'.','divine',p)}else if(['distance','size','tempBias','water','atmosphere','resources'].includes(key)){p[key]=Number(t.value);if(key==='distance')p.distance=clamp(p.distance,.35,3.5);pushLog('You changed '+p.name+': '+key+'.','divine',p)}if(!t.matches('input[type=text]'))renderSheet()}updateHUD();scheduleSave()});
$('importFile').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{let s=JSON.parse(await file.text());if(!validate(s))throw Error('This is not a supported GENESIS save.');if(!confirm('Replace your current universe with this backup?'))return;state=normalizeState(s);state.speed=Number.isFinite(Number(state.speed))?Number(state.speed):1;state.firstContacts=state.firstContacts||[];state.counter=state.counter||Math.max(1,...state.planets.map(p=>p.id+1));selected=state.planets[0]?.id??null;pendingEvent=null;updateEventBadge();save();closePanel();updateHUD();toast('✓ Universe restored');}catch(err){alert('Could not import backup: '+err.message)}finally{e.target.value=''}});
window.addEventListener('resize',resize);document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});window.addEventListener('pagehide',save);
resize();updateHUD();let last=performance.now(),accum=0,lastAutosave=last,lastEventAt=last;function loop(t){let dt=clamp((t-last)/1000,0,.08);last=t;now+=dt*(state.speed===0?.06:clamp(Math.pow(state.speed,.21),.3,4));if(state.speed>0&&!pendingEvent){const rates={1:1000,10:20000,100:1000000,1000:15000000};let years=(rates[state.speed]||1000)*dt;accum+=years;if(accum>=150){applyTime(accum);accum=0}if(state.ambientEvents&&t-lastEventAt>35000&&state.planets.length&&state.eventInbox.length<12&&Math.random()<.0015*state.planets.length){lastEventAt=t;launchEvent(null,null,null,false)}}if(t-lastHud>1200){updateHUD();lastHud=t}if(t-lastAutosave>5000){save();lastAutosave=t}draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
window.__genesisTest={getState:()=>state,advance:applyTime,create:addPlanet,power:usePower,habit,temperature,select:id=>{selected=id;updateHUD()},open:panel,close:closePanel,save,launchEvent,resolveEvent,starClass,starLight,starRadiation,lifeCount,evolvePercent};
})();
</script>
